#
# Serves the built frontend and proxies the api, so the browser talks to a
# single origin and CORS never enters the picture.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached. It is the only file that names the
    # hashed bundle, so a cached copy pins the browser to the previous build -
    # including the version number in the corner, which then reports a version
    # that is no longer running. That defeats the entire point of showing it.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Workout archives and PMTiles range requests are both large.
        client_max_body_size 512m;
        proxy_read_timeout 300s;
    }

    location = /healthz {
        proxy_pass http://api:8000/healthz;
        proxy_set_header Host $host;
        access_log off;
    }
}
