# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Pushing a v* tag is what publishes FogMap. Nothing else does.
# The tag, the VERSION file and the image tag must always agree, and every
# version must have release notes - both are hard failures, not warnings.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub Release
  packages: write # push images to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  guard:
    name: Check version and release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the version from the tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: VERSION and CHANGELOG must agree with the tag
        run: python3 scripts/release_guard.py check "${{ steps.tag.outputs.version }}"

  test:
    name: Test
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Publishing an image whose tests were never run is not a release,
      # it is a guess.
      - name: Run the test suite
        run: docker compose run --rm --build test

  publish:
    name: Build and push ${{ matrix.service }}
    needs: [guard, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, web]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both machines are amd64, so there is no multi-platform build to set up.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/fogmap-${{ matrix.service }}:${{ needs.guard.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/fogmap-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release notes
    needs: [guard, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract this version's section from CHANGELOG.md
        run: |
          python3 scripts/release_guard.py section "${{ needs.guard.outputs.version }}" \
            > release-notes.md
          cat release-notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FogMap ${{ needs.guard.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ startsWith(needs.guard.outputs.version, '0.') }}
