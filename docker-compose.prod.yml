#
# Production. Pulls published images from GHCR and never builds.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# FOGMAP_IMAGE_TAG must name an explicit version. `latest` is deliberately not
# the default: a production host that silently changes version when it happens
# to pull is a host nobody can debug.

services:
  api:
    image: ghcr.io/n0ne117/fogmap-api:${FOGMAP_IMAGE_TAG:?set FOGMAP_IMAGE_TAG to an explicit version, for example 0.2.0}
    environment:
      FOGMAP_TOKEN: ${FOGMAP_TOKEN:?set FOGMAP_TOKEN in .env}
      FOGMAP_DATA_DIR: /data
    volumes:
      - ${FOGMAP_DATA_HOST:-./data}:/data:z
    ports:
      - "${FOGMAP_API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz").read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/n0ne117/fogmap-web:${FOGMAP_IMAGE_TAG:?set FOGMAP_IMAGE_TAG to an explicit version, for example 0.2.0}
    ports:
      - "${FOGMAP_WEB_PORT:-8080}:80"
    depends_on:
      - api
    restart: unless-stopped
