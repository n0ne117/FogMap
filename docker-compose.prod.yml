#
# Production. Pulls published images from GHCR and never builds.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# IRFARAN_IMAGE_TAG must name an explicit version. `latest` is deliberately not
# the default: a production host that silently changes version when it happens
# to pull is a host nobody can debug.

# The FOGMAP_ fallbacks are for installs that predate the rename in 0.10.0.
# Compose forwards named variables, so a .env still saying FOGMAP_TOKEN would
# otherwise never reach the container however forgiving the code inside is.
# IRFARAN_ wins where both are set.

services:
  api:
    image: ghcr.io/n0ne117/irfaran-api:${IRFARAN_IMAGE_TAG:-${FOGMAP_IMAGE_TAG:?set IRFARAN_IMAGE_TAG to an explicit version, for example 0.2.0}}
    environment:
      # Blank is allowed and is the recommended first run: Irfaran generates a
      # token on first start and shows it on the setup screen. Requiring one
      # here predates that, and made the documented quickstart fail with an
      # error naming a variable the user had never heard of.
      IRFARAN_TOKEN: ${IRFARAN_TOKEN:-${FOGMAP_TOKEN:-}}
      IRFARAN_DATA_DIR: /data
      # Set IRFARAN_BASEMAP_HOST to keep the 137 GB basemap off the disk the
      # rest of the data is on. Defaults to living inside it.
      IRFARAN_BASEMAP_DIR: ${IRFARAN_BASEMAP_HOST:+/basemap}
    volumes:
      - ${IRFARAN_DATA_HOST:-${FOGMAP_DATA_HOST:-./data}}:/data:z
      - ${IRFARAN_BASEMAP_HOST:-${IRFARAN_DATA_HOST:-${FOGMAP_DATA_HOST:-./data}}}:/basemap:z
    ports:
      - "${IRFARAN_API_PORT:-${FOGMAP_API_PORT:-8000}}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz").read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    image: ghcr.io/n0ne117/irfaran-web:${IRFARAN_IMAGE_TAG:-${FOGMAP_IMAGE_TAG:?set IRFARAN_IMAGE_TAG to an explicit version, for example 0.2.0}}
    ports:
      - "${IRFARAN_WEB_PORT:-${FOGMAP_WEB_PORT:-8080}}:80"
    depends_on:
      - api
    restart: unless-stopped
