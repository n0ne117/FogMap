#
# Local development on the Fedora workstation. Builds from source.
# Production uses docker-compose.prod.yml, which pulls from ghcr.io instead.
#
# Every bind mount carries the :z SELinux label. Without it Fedora denies the
# container access to ./data. It is harmless on non-SELinux hosts, so it is
# set unconditionally.

# The FOGMAP_ fallbacks are for installs that predate the rename in 0.10.0.
# Compose forwards named variables, so a .env still saying FOGMAP_TOKEN would
# otherwise never reach the container however forgiving the code inside is.
# IRFARAN_ wins where both are set.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: runtime
    image: irfaran-api:dev
    environment:
      IRFARAN_TOKEN: ${IRFARAN_TOKEN:-${FOGMAP_TOKEN:-}}
      IRFARAN_DATA_DIR: /data
    volumes:
      - ${IRFARAN_DATA_HOST:-${FOGMAP_DATA_HOST:-./data}}:/data:z
    ports:
      - "${IRFARAN_API_PORT:-${FOGMAP_API_PORT:-8000}}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz").read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      target: runtime
    image: irfaran-web:dev
    ports:
      - "${IRFARAN_WEB_PORT:-${FOGMAP_WEB_PORT:-8080}}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Not started by `up`. Run it explicitly with `docker compose run --rm test`.
  test:
    build:
      context: .
      dockerfile: api/Dockerfile
      target: test
    image: irfaran-api-test:dev
    profiles:
      - test
    environment:
      IRFARAN_DATA_DIR: /tmp/irfaran-test
    command: ["pytest"]
