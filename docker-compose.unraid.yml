#
# Irfaran on unraid, through the Docker Compose Manager plugin.
#
# Everything is written out in full. There is not a single ${VARIABLE} in
# here, because the plugin's stack editor gives you this file and nothing
# else to go with it - whether it also offers somewhere to put a .env depends
# on the plugin version, and a compose file that silently needs one you cannot
# reach is worse than no compose file at all.
#
# Edit the four marked lines and paste the result into
#   Docker -> Compose -> your stack -> Edit Stack -> Compose File
#
# No API token is set here on purpose. Irfaran generates one on first start
# and shows it on the setup screen, once. Read it back later with:
#   docker exec irfaran-api python -m irfaran.cli token

services:
  api:
    # CHANGE ME: pin an explicit version. The current one is on
    # https://github.com/n0ne117/Irfaran/releases - do not use latest, a host
    # that silently changes version when it pulls is a host nobody can debug.
    image: ghcr.io/n0ne117/irfaran-api:0.11.3
    container_name: irfaran-api
    environment:
      IRFARAN_DATA_DIR: /data
      IRFARAN_BASEMAP_DIR: /basemap
    volumes:
      # CHANGE ME: the database, tiles and blobs. Small, irreplaceable, and
      # read constantly - this belongs on the cache pool with your appdata.
      - /mnt/user/appdata/irfaran:/data

      # CHANGE ME: the basemap. Around 137 GB of public map data that can
      # always be downloaded again, so it belongs on the array and not on the
      # cache. Set that share's "Use cache" to No before starting the
      # download, or the mover will spend the night shifting it.
      - /mnt/user/maps/irfaran:/basemap
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz").read()
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web:
    # CHANGE ME: the same version as the api above. They are released together
    # and the app tells you when they disagree.
    image: ghcr.io/n0ne117/irfaran-web:0.11.3
    container_name: irfaran-web
    depends_on:
      - api
    ports:
      # CHANGE ME if 8080 is taken. The left number is the one you browse to.
      - "8080:80"
    restart: unless-stopped
